name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required by NuGet Trusted Publishing (GitHub OIDC token)

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore SharpWarden/SharpWarden.csproj

      - name: Build SharpWarden
        run: dotnet build SharpWarden/SharpWarden.csproj --configuration Release --no-restore /p:Version=${VERSION}

      - name: Pack NuGet package
        run: dotnet pack SharpWarden/SharpWarden.csproj --configuration Release --no-build -o ./nupkg /p:Version=${VERSION}

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1 hour) NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org (owner: Nemirtingas, repository: SharpWarden, workflow: nuget.yml).
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json